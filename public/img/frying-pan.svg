<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Frying Pan Group (tilted at -15 degrees for the floating look) -->
  <g transform="rotate(-15 100 100)">
    <!-- 1. Handle Connector Outline -->
    <line x1="110" y1="95" x2="128" y2="80" stroke="#6B184E" stroke-width="10" stroke-linecap="round" />
    <!-- 2. Handle Connector Inner (Brand Orange) -->
    <line x1="110" y1="95" x2="128" y2="80" stroke="#FFA726" stroke-width="6" stroke-linecap="round" />
    
    <!-- 3. Handle Grip (Brand Purple) -->
    <line x1="125" y1="82.3" x2="175" y2="40" stroke="#6B184E" stroke-width="12" stroke-linecap="round" />
    <!-- 4. Handle Hole -->
    <circle cx="167.2" cy="46.6" r="2.5" fill="#F2EAEF" />

    <!-- 5. Outer Pan Body (Red-Orange Depth Rim) -->
    <ellipse cx="80" cy="120" rx="50" ry="32" fill="#E67E22" stroke="#6B184E" stroke-width="4" />
    <!-- 6. Outer Pan Body (Brand Orange Surface) -->
    <ellipse cx="80" cy="116" rx="50" ry="32" fill="#FFA726" stroke="#6B184E" stroke-width="4" />
    
    <!-- 7. Inner Cooking Surface (White Ceramic for High Contrast) -->
    <ellipse cx="80" cy="112" rx="44" ry="26" fill="#FFFFFF" stroke="#6B184E" stroke-width="2" />
    
    <!-- 8. Soft Ceramic Accent/Highlight -->
    <ellipse cx="80" cy="114" rx="42" ry="24" fill="none" stroke="rgba(107, 24, 78, 0.08)" stroke-width="2" />
    <path d="M 45 116 A 35 18 0 0 0 85 125" fill="none" stroke="rgba(107, 24, 78, 0.15)" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
